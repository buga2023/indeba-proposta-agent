<!-- Arte ILUSTRATIVA de recipiente — tonel azul de 50 (kg ou L), a embalagem padrão
     do catálogo nesse tamanho (Gustavo, jul/2026). Só para produto SEM foto de
     estúdio; UI e PDF marcam "imagem ilustrativa". Fundo transparente. -->
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Tonel azul de 50 litros (ilustrativo)">
  <defs>
    <linearGradient id="t-corpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#134a80"/>
      <stop offset="0.26" stop-color="#2f80c9"/>
      <stop offset="0.62" stop-color="#1E6BB8"/>
      <stop offset="1" stop-color="#0f3f6e"/>
    </linearGradient>
  </defs>
  <ellipse cx="150" cy="262" rx="62" ry="9" fill="#0f2a44" opacity=".10"/>
  <!-- corpo cilíndrico -->
  <path d="M92 62h116v186a10 10 0 0 1-10 10H102a10 10 0 0 1-10-10z" fill="url(#t-corpo)"/>
  <!-- topo -->
  <ellipse cx="150" cy="62" rx="58" ry="14" fill="#3f8ed2"/>
  <ellipse cx="150" cy="62" rx="46" ry="10" fill="#2f7cbd"/>
  <!-- bujões -->
  <ellipse cx="128" cy="60" rx="9" ry="4.5" fill="#0f3f6e"/>
  <ellipse cx="170" cy="64" rx="6" ry="3.5" fill="#0f3f6e"/>
  <!-- nervuras -->
  <rect x="92" y="112" width="116" height="12" fill="#0f4a80" opacity=".55"/>
  <rect x="92" y="196" width="116" height="12" fill="#0f4a80" opacity=".55"/>
  <!-- rótulo -->
  <rect x="104" y="136" width="92" height="52" rx="5" fill="#ffffff" opacity=".96"/>
  <rect x="104" y="136" width="92" height="8" rx="4" fill="#F07A22"/>
  <path d="M116 160h68M116 172h44" stroke="#c9d3de" stroke-width="5" stroke-linecap="round"/>
  <text x="150" y="234" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#d7e6f5" text-anchor="middle">50</text>
</svg>
