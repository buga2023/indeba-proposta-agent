<!-- Arte ILUSTRATIVA de recipiente — bombona azul de 50 (kg ou L), a embalagem padrão
     do catálogo nesse tamanho (Gustavo, jul/2026). O desenho segue a bombona real da
     linha Texspar/Primmax CIP: corpo abaulado, ombro chanfrado e os bujões de saque no
     topo. Só para produto SEM foto de estúdio da embalagem cotada; UI e PDF marcam
     "imagem ilustrativa". Sem número no desenho: o tamanho cotado (58 kg, 66 kg, 75 kg…)
     é o que aparece no texto ao lado — arte nenhuma pode contradizer a embalagem cotada.
     Fundo transparente. -->
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Bombona azul de 50 litros (ilustrativo)">
  <defs>
    <linearGradient id="t-corpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123f6e"/>
      <stop offset="0.24" stop-color="#2d76bb"/>
      <stop offset="0.6" stop-color="#1c5d9e"/>
      <stop offset="1" stop-color="#0e3358"/>
    </linearGradient>
  </defs>
  <ellipse cx="150" cy="264" rx="60" ry="9" fill="#0f2a44" opacity=".10"/>
  <!-- corpo abaulado -->
  <path d="M110 66h80c8 0 14 6 15 14l5 44c2 16 2 42 0 58l-5 60c-1 8-7 14-15 14h-80c-8 0-14-6-15-14l-5-60c-2-16-2-42 0-58l5-44c1-8 7-14 15-14z"
        fill="url(#t-corpo)"/>
  <!-- ombro / topo chanfrado -->
  <path d="M110 66h80c8 0 14 6 15 14l1 8H94l1-8c1-8 7-14 15-14z" fill="#3a83c6"/>
  <!-- bujões de saque -->
  <ellipse cx="124" cy="63" rx="11" ry="6" fill="#93a4b3"/>
  <ellipse cx="124" cy="60" rx="11" ry="6" fill="#b3c1cd"/>
  <ellipse cx="150" cy="63" rx="11" ry="6" fill="#93a4b3"/>
  <ellipse cx="150" cy="60" rx="11" ry="6" fill="#b3c1cd"/>
  <ellipse cx="180" cy="70" rx="9" ry="5" fill="#93a4b3"/>
  <ellipse cx="180" cy="67" rx="9" ry="5" fill="#b3c1cd"/>
  <!-- brilho lateral -->
  <path d="M112 92c-4 40-4 80 0 130" stroke="#6aa8dd" stroke-width="7" stroke-linecap="round" opacity=".45" fill="none"/>
  <!-- rótulo -->
  <rect x="110" y="112" width="86" height="66" rx="6" fill="#ffffff" opacity=".97"/>
  <rect x="110" y="112" width="86" height="9" rx="4" fill="#F07A22"/>
  <path d="M122 140h62M122 152h40M122 164h54" stroke="#c9d3de" stroke-width="5" stroke-linecap="round"/>
</svg>
