<!-- Arte ILUSTRATIVA de recipiente — galão de 5 L (bombona plástica com alça).
     Usada só por produto SEM foto de estúdio cadastrada; a UI e o PDF marcam
     "imagem ilustrativa" (ver imagemEhIlustrativa em src/lib/imagem-produto.ts).
     Convenção de embalagem do catálogo (Gustavo, jul/2026): 5 = galão, 20 = balde,
     50 = tonel azul. Fundo transparente: cai limpo no card branco da ficha. -->
<svg xmlns="http://www.w3.org/2000/svg" width="138" height="239" viewBox="81 31 138 239" role="img" aria-label="Galão de 5 litros (ilustrativo)">
  <defs>
    <linearGradient id="g-corpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe6ee"/>
      <stop offset="0.28" stop-color="#f6f9fc"/>
      <stop offset="0.75" stop-color="#e2e9f1"/>
      <stop offset="1" stop-color="#c8d3de"/>
    </linearGradient>
  </defs>
  <!-- sombra de apoio -->
  <ellipse cx="150" cy="258" rx="66" ry="9" fill="#0f2a44" opacity=".08"/>
  <!-- gargalo e tampa -->
  <rect x="132" y="46" width="36" height="22" rx="4" fill="#c8d3de"/>
  <rect x="126" y="34" width="48" height="18" rx="6" fill="#8fa2b4"/>
  <!-- alça -->
  <path d="M168 52h20a14 14 0 0 1 14 14v26a10 10 0 0 1-10 10h-6V92h4a4 4 0 0 0 4-4V68a6 6 0 0 0-6-6h-20z" fill="#a9b8c8"/>
  <!-- corpo -->
  <path d="M104 66h92a16 16 0 0 1 16 16v146a16 16 0 0 1-16 16h-92a16 16 0 0 1-16-16V82a16 16 0 0 1 16-16z" fill="url(#g-corpo)" stroke="#b3c0cd" stroke-width="2"/>
  <!-- vincos laterais -->
  <path d="M96 108h108M96 210h108" stroke="#c3cedb" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <!-- rótulo -->
  <rect x="106" y="122" width="88" height="74" rx="6" fill="#ffffff" stroke="#dde5ee" stroke-width="2"/>
  <rect x="106" y="122" width="88" height="9" rx="4" fill="#F07A22"/>
  <path d="M118 150h64M118 162h48M118 174h56" stroke="#c9d3de" stroke-width="5" stroke-linecap="round"/>
</svg>
