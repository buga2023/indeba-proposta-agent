<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de Contratos — Indeba Express</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a3253;
    --navy-deep: #12233b;
    --orange: #eb5a1a;
    --red: #e73620;
    --yellow: #fad306;
    --ink: #1c2433;
    --ink-soft: #55607a;
    --paper: #f3f5f9;
    --panel: #ffffff;
    --line: #dde2ec;
    --brand: #1a3253;
    --brand-soft: #e8edf5;
    --on-brand: #ffffff;
    --gap-fill: #fff3e6;
    --gap-border: #f0b27a;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e8ecf4; --ink-soft: #a6b0c6; --paper: #0e1626; --panel: #152036; --line: #263450;
      --brand: #8fb0e6; --brand-soft: #1c2b47; --on-brand: #0e1a2e;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e8ecf4; --ink-soft: #a6b0c6; --paper: #0e1626; --panel: #152036; --line: #263450;
    --brand: #8fb0e6; --brand-soft: #1c2b47; --on-brand: #0e1a2e;
  }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); }

  header { padding: env(safe-area-inset-top, 0px) 28px 0 28px; background: var(--navy); color: #fff; position: relative; }
  header::after {
    content: ""; display: block; height: 4px; margin: 0 -28px;
    background: linear-gradient(90deg, var(--red), var(--orange) 55%, var(--yellow));
  }
  .header-inner {
    max-width: 1280px; margin: 0 auto; padding: 16px 0;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .header-inner img { height: 46px; width: auto; display: block; }
  .tagline { font-size: 13px; color: #c9d4e8; max-width: 380px; text-align: right; line-height: 1.5; }

  main {
    max-width: 1280px; margin: 0 auto; padding: 28px;
    display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 24px; align-items: start;
  }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; padding: 18px; } .tagline { text-align: left; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .form-panel { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
  @media (max-width: 880px) { .form-panel { position: static; max-height: none; overflow: visible; } }

  .preview-toolbar h2 { border-bottom: none !important; }
  .form-panel h2, .preview-toolbar h2 {
    font-size: 16px; font-weight: 700; margin: 0; padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line); color: var(--brand);
  }
  .form-body { padding: 18px 20px 12px; display: flex; flex-direction: column; gap: 20px; }
  fieldset { border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  legend {
    font-size: 11.5px; font-weight: 600; color: var(--orange); text-transform: uppercase; letter-spacing: 0.06em;
    padding: 0 0 6px; border-bottom: 1px solid var(--line); width: 100%; margin-bottom: 2px;
  }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-soft); }
  label span.field-label { color: var(--ink); font-weight: 600; font-size: 13.5px; }
  input, textarea {
    font-family: inherit; font-size: 14.5px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--paper); color: var(--ink); resize: vertical; width: 100%; min-width: 0;
  }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; border-color: var(--orange); }
  textarea { min-height: 72px; line-height: 1.4; }
  .hint { font-size: 12px; color: var(--ink-soft); line-height: 1.4; }
  .hint.warn { color: #d23a20; font-weight: 600; }
  .hint.good { color: #2f9e6a; font-weight: 600; }
  input[aria-invalid="true"] { border-color: #d23a20; }

  .status-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-soft); padding: 6px 20px 18px; }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--yellow); flex: none; }
  .status-dot.done { background: #2f9e6a; }

  .preview-panel { display: flex; flex-direction: column; min-height: 70vh; }
  .preview-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line); padding-right: 16px; flex-wrap: wrap; gap: 10px;
  }
  .toolbar-actions { display: flex; gap: 10px; flex-wrap: wrap; padding: 10px 0; align-items: center; }
  button {
    font-family: inherit; font-size: 13.5px; font-weight: 600; border-radius: 6px; padding: 10px 16px;
    cursor: pointer; border: 1px solid var(--brand); background: var(--brand); color: var(--on-brand);
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button.secondary { background: transparent; color: var(--brand); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: progress; }
  #actionStatus { font-size: 12.5px; color: var(--brand); min-width: 110px; max-width: 260px; text-align: right; }

  .doc-scroll { flex: 1; overflow: auto; padding: 28px clamp(10px, 3vw, 40px) 50px; background: var(--paper); border-radius: 0 0 8px 8px; }

  /* ---------- Folha do contrato (sempre clara, como o papel) ---------- */
  .doc-page {
    max-width: 800px; margin: 0 auto; background: #fff; color: #1e2533;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px; line-height: 1.62; box-shadow: 0 2px 18px rgba(16, 30, 60, 0.14); border-radius: 3px; overflow: hidden; padding-bottom: 44px;
  }
  .doc-page .band { position: relative; background: #1a3253; height: 132px; }
  .doc-page .band-logo { position: absolute; left: clamp(20px, 5vw, 46px); top: 50%; transform: translateY(-50%); height: 74px; width: auto; }
  .doc-page .band-flame { position: absolute; right: clamp(10px, 4vw, 40px); bottom: 20px; width: 200px; max-width: 34%; height: auto; opacity: 0.95; }
  .doc-page .strip { height: 5px; background: linear-gradient(90deg, #e73620, #eb5a1a 55%, #fad306); }
  .doc-page .sheet-body { padding: 26px clamp(20px, 5vw, 46px) 0; }
  .doc-page h1.doc-title {
    font-size: 16.5px; line-height: 1.32; font-weight: 700; color: #1a3253; margin: 0 0 20px;
    border-left: 4px solid #eb5a1a; padding-left: 12px; text-transform: uppercase; letter-spacing: 0.01em;
  }
  .doc-page .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  @media (max-width: 560px) { .doc-page .parties { grid-template-columns: 1fr; } }
  .doc-page .card { background: #f2f5f9; border-left: 3px solid #1a3253; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .doc-page .card.org { border-left-color: #eb5a1a; }
  .doc-page .card .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; color: #eb5a1a; margin-bottom: 4px; }
  .doc-page .card .k { font-size: 10.5px; color: #66718a; margin-top: 4px; }
  .doc-page .card .val { font-weight: 700; color: #1a3253; font-size: 13.5px; overflow-wrap: anywhere; }
  .doc-page p.intro { margin: 0 0 6px; text-align: justify; }

  .doc-page .clause-head { position: relative; display: flex; align-items: center; gap: 12px; margin: 26px 0 12px; padding-bottom: 7px; border-bottom: 1px solid #d5dbe5; }
  .doc-page .clause-head::after { content: ""; position: absolute; left: 0; bottom: -1px; width: 46px; height: 2px; background: #eb5a1a; }
  .doc-page .badge { flex: none; background: #1a3253; color: #fff; font-weight: 700; font-size: 11px; letter-spacing: 0.05em; padding: 4px 10px; line-height: 1.3; }
  .doc-page .ct { font-weight: 700; color: #1a3253; font-size: 13.5px; text-transform: uppercase; line-height: 1.3; }
  .doc-page .it { display: grid; grid-template-columns: 38px 1fr; column-gap: 8px; margin: 0 0 7px; }
  .doc-page .it .n { font-weight: 700; color: #eb5a1a; }
  .doc-page .it .tx { text-align: justify; hyphens: auto; }
  .doc-page .it.l0 { padding-left: 46px; display: block; }
  .doc-page .it.l2 { margin-left: 46px; grid-template-columns: 44px 1fr; }
  .doc-page .it.eq { display: block; padding-left: 46px; }
  .doc-page .closing { margin: 26px 0 4px; text-align: justify; }
  .doc-page .sign-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .doc-page .sign-line { border-top: 1.5px solid #1a3253; margin: 40px 0 6px; }
  .doc-page .sign-grid p { margin: 0; font-size: 12.5px; line-height: 1.5; overflow-wrap: anywhere; }
  .doc-page .sign-grid p strong { color: #1a3253; }
  .doc-page .wit { margin: 28px 0 0; font-weight: 700; color: #1a3253; font-size: 12px; letter-spacing: 0.06em; }

  .gap { background: #fff3e6; border-bottom: 2px solid #f0b27a; padding: 0 3px; border-radius: 2px; font-weight: 600; color: #7a4a1f; }
  .gap.filled { background: transparent; border-bottom: 1px solid #1a3253; font-weight: 700; color: #1a3253; }

  @media print {
    header, .form-panel, .preview-toolbar { display: none !important; }
    body { background: #fff; }
    main { display: block; padding: 0; }
    .doc-scroll { padding: 0; overflow: visible; background: #fff; }
    .panel { border: none; }
    .doc-page { box-shadow: none; }
    .gap { background: none; border-bottom: none; }
  }
</style>
<script src="./pdf-lib.min.js"></script>
</head>
<body>

<header>
  <div class="header-inner">
    <img id="appLogo" alt="Indeba Express">
    <div class="tagline">Gerador de contratos de fornecimento de produtos químicos e assistência técnica, com equipamentos em comodato.</div>
  </div>
</header>

<main>
  <section class="panel form-panel">
    <h2>Dados do cliente</h2>
    <div class="form-body">
      <fieldset>
        <legend>Contratante</legend>
        <label>
          <span class="field-label">Razão social do cliente</span>
          <input id="f_nome" type="text" autocomplete="off" placeholder="Ex.: Restaurante Sabor da Bahia Ltda.">
        </label>
        <label>
          <span class="field-label">CNPJ do cliente</span>
          <input id="f_cnpj" type="text" inputmode="numeric" autocomplete="off" maxlength="18" placeholder="00.000.000/0000-00">
          <span class="hint" id="cnpjHint">Formatação automática: 00.000.000/0000-00.</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>Equipamentos em comodato</legend>
        <label>
          <span class="field-label">Valor total do investimento (R$)</span>
          <input id="f_valor" type="text" inputmode="decimal" autocomplete="off" placeholder="Ex.: 8.500,00">
          <span class="hint" id="extensoHint">O valor por extenso é escrito automaticamente.</span>
        </label>
        <label>
          <span class="field-label">Equipamentos comodatados</span>
          <textarea id="f_equip" placeholder="Ex.: 2 dosadores automáticos de cloro, 1 diluidor de multiuso, 1 carrinho funcional"></textarea>
          <span class="hint">Liste os equipamentos cedidos, como aparecerão na Cláusula 8.2.</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>Prazo e assinatura</legend>
        <label>
          <span class="field-label">Duração do contrato</span>
          <input id="f_prazo" type="text" autocomplete="off" placeholder="Ex.: 12 (doze) meses">
          <span class="hint">Vale também como prazo inicial mínimo da Cláusula 14.2.</span>
        </label>
        <label>
          <span class="field-label">Data de assinatura</span>
          <input id="f_data" type="date">
        </label>
      </fieldset>

      <fieldset>
        <legend>Cláusula 14.2 — Rescisão antecipada</legend>
        <label>
          <span class="field-label">Texto da cláusula</span>
          <textarea id="f_c142" style="min-height:200px"></textarea>
          <span class="hint" id="c142Hint"></span>
        </label>
        <button type="button" class="secondary" id="btnReset142">Restaurar texto padrão</button>
      </fieldset>
    </div>
    <div class="status-row">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">0 de 6 campos preenchidos</span>
    </div>
  </section>

  <section class="panel preview-panel">
    <div class="preview-toolbar">
      <h2>Pré-visualização</h2>
      <div class="toolbar-actions">
        <span id="actionStatus" role="status" aria-live="polite"></span>
        <button id="btnCopy" type="button" class="secondary">Copiar texto</button>
        <button id="btnPdf" type="button">Baixar PDF</button>
      </div>
    </div>
    <div class="doc-scroll">
      <article class="doc-page" id="docPage"></article>
    </div>
  </section>
</main>

  /* ================= Conteúdo do contrato (fonte única: tela e PDF) ================= */
  var CLAUSES = [{"t": "CLÁUSULA 1 — OBJETO DO CONTRATO", "p": ["1.1. A Indeba Express (CONTRATADA) compromete-se a fornecer e a CONTRATANTE compromete-se a adquirir, em caráter continuado e dentro das condições estabelecidas neste contrato, produtos de higienização, produtos esses adiante denominados simplesmente como PRODUTOS.", "1.2. A CONTRATANTE declara que os PRODUTOS foram previamente aprovados para uso em suas instalações.", "1.3. A venda dos PRODUTOS para a CONTRATANTE será realizada diretamente pela Indeba Express, ou eventualmente por quaisquer das suas filiais ou distribuidor credenciado Indeba Express dentro da Bahia.", "1.4. Os PRODUTOS serão consumidos pela CONTRATANTE em sua unidade."]}, {"t": "CLÁUSULA 2 — DA VALIDADE DO CONTRATO", "p": ["2.1. O presente Contrato constitui o entendimento integral entre as partes contratantes em relação ao seu objeto e revoga expressamente todas e quaisquer tratativas, discussões, ou instrumentos firmados anteriormente e obriga as partes e seus eventuais sucessores, até a conclusão das obrigações estabelecidas.", "2.2. Faz parte integrante e indissociável deste instrumento, como se nele estivesse transcrito, o ANEXO I, que corresponde à proposta comercial previamente apresentada pela CONTRATADA e aceita pela CONTRATANTE, contendo produtos, embalagens e preços, igualmente firmado pelas partes."]}, {"t": "CLÁUSULA 3 — TERMOS CONFLITANTES", "p": ["No caso de qualquer divergência entre este contrato e seus anexos, caso exista, prevalecerão os termos e cláusulas do presente Contrato. Em caso de divergência entre anexos, prevalece o de data mais recente."]}, {"t": "CLÁUSULA 4 — DAS CONDIÇÕES DO FORNECIMENTO", "p": ["4.1. A Indeba Express fornecerá e instalará os equipamentos de dosagem automática para dosagem de químicos e outros equipamentos necessários para suportar os suprimentos oferecidos pela mesma.", "4.2. Competirá à CONTRATADA a definição dos processos de higienização juntamente à CONTRATANTE.", "4.3. A CONTRATADA fornecerá os produtos necessários para higienização dos estabelecimentos da CONTRATANTE. Para suprimento extraordinário o prazo de entrega é de até 72 horas do recebimento do pedido.", "4.4. Os preços dos produtos aplicáveis constam do ANEXO I (Proposta Comercial) deste instrumento. A CONTRATADA compromete-se a manter fixos e irreajustáveis esses preços, por 12 (doze) meses, a partir da assinatura deste contrato, findo os quais os valores serão reajustados pela variação acumulada do IPC-A, salvo na ocorrência de reajuste autorizado por medida governamental, ou, a qualquer tempo, pela ocorrência de majorações de insumos que comprovadamente afetem o equilíbrio econômico-financeiro deste instrumento.", "4.5. Os produtos fornecidos pela CONTRATADA serão faturados para pagamento num prazo de 28 dias da data de emissão das Notas Fiscais. O valor mínimo por pedido é de R$ 500,00 (quinhentos reais)."]}, {"t": "CLÁUSULA 5 — INCIDÊNCIAS FISCAIS", "p": ["5.1. Os tributos (impostos, taxas, emolumentos, contribuições fiscais e parafiscais), que sejam devidos em decorrência, direta ou indireta do Contrato ou de sua execução, serão de exclusiva responsabilidade do contribuinte assim definido na norma tributária, sem direito a reembolso. A CONTRATANTE, quando fonte retentora, descontará e recolherá, nos prazos de Lei, dos pagamentos que efetuar, os tributos a que esteja obrigada pela legislação vigente.", "5.2. Se durante o prazo de vigência do presente Contrato, forem criados novos tributos ou modificadas as alíquotas dos atuais, de forma a comprovadamente majorar ou diminuir os ônus da CONTRATADA, os preços serão revistos, a fim de adequá-los a essas modificações, compensando-se na primeira oportunidade quaisquer diferenças decorrentes destas alterações."]}, {"t": "CLÁUSULA 6 — SIGILO E CONFIDENCIALIDADE", "p": ["6.1. Este contrato e toda a informação, \"know-how\" e dados, sejam eles técnicos ou não, tangíveis ou em formato eletrônico, que tenham sido ou venham a ser revelados à CONTRATADA pela CONTRATANTE e vice-versa, no curso da execução deste instrumento, são considerados informações confidenciais, devendo as partes manter sigilo e prevenir a divulgação de quaisquer informações confidenciais, exceto aos seus funcionários que dela necessitem para permitir que se conduza adequadamente a execução do Contrato. As partes contratantes não poderão utilizar, reproduzir, distribuir, divulgar ou permitir a divulgação dessas informações confidenciais, exceto na forma aqui prevista.", "6.2. As partes concordam em que as obrigações previstas nesta Cláusula continuarão em vigor mesmo após o término dos serviços objeto deste Contrato.", "6.3. O descumprimento das obrigações constantes desta Cláusula sujeitará à parte infratora ao ressarcimento das perdas e danos que causar à outra parte.", "6.4. A obrigação de confidencialidade aqui prevista não se aplicará, entretanto, quando a informação for: a) do conhecimento público; b) do prévio conhecimento das partes envolvidas no contrato; c) recebida pelos contratantes em boa fé, de um terceiro não envolvido no contrato."]}, {"t": "CLÁUSULA 7 — OBRIGAÇÕES DA CONTRATANTE", "p": ["7.1. A CONTRATANTE obriga-se a fornecer, em tempo hábil, todas as informações necessárias à consecução dos objetivos deste Contrato.", "7.2. A CONTRATANTE obriga-se a efetuar o pagamento das faturas apresentadas no prazo e condições estabelecidas neste Contrato.", "7.3. A CONTRATANTE fornecerá à CONTRATADA as recomendações e/ou instruções especiais a serem seguidas visando a uma melhor execução do contrato.", "7.4. Determinar a todos os setores da empresa que emprestem o máximo de colaboração aos Orientadores Técnicos da CONTRATADA, para máxima consecução do objeto deste Contrato.", "7.5. Permitir que a CONTRATADA utilize, quando necessário e de acordo com as disponibilidades, seus equipamentos e estrutura de escritório, para o alcance do objetivo do contrato.", "7.6. Uso exclusivo dos produtos Indeba Express.", "7.7. Consumo mínimo mensal dos produtos Indeba Express, igual ou superior a 50% do valor do investimento total da CONTRATADA na unidade consumidora."]}, {"t": "CLÁUSULA 8 — OBRIGAÇÕES DA CONTRATADA", "p": ["8.1. Instalar, na unidade de consumo da CONTRATANTE, em regime de comodato, equipamentos dosadores e demais equipamentos efetivamente necessários à utilização dos insumos fornecidos, em perfeitas condições de servir ao fim a que se destinam, objetivando o uso de forma eficiente, com custo competitivo e máxima segurança.", "8.2. O investimento total da CONTRATADA para a cessão dos equipamentos, custos de instalação, acessórios, etc., descritos no item 4.1 anterior, monta {valor}.", {"equip": true}, "8.3. Assistir tecnicamente a CONTRATANTE, visando referendar, com mão-de-obra especializada, princípios básicos de higienização, bem como amplo suporte quanto à aplicação de seus sistemas frente às necessidades identificadas, empregando pessoal técnico local e suporte de fábrica."]}, {"t": "CLÁUSULA 9 — OBRIGAÇÕES MÚTUAS", "p": ["9.1. Toda e qualquer ordem ou determinação que a CONTRATANTE desejar dar aos empregados da CONTRATADA será a esta solicitada, salvo em caso de urgência, após o que todas as solicitações feitas diretamente deverão ser comunicadas à CONTRATADA.", "9.2. Competirá às partes a promoção de esforços conjuntos visando melhorias contínuas dos procedimentos e obtenção de um resultado final de alto padrão."]}, {"t": "CLÁUSULA 10 — DA ASSISTÊNCIA TÉCNICA", "p": ["10.1. A CONTRATADA prestará Assistência Técnica regular para a adequada utilização dos insumos fornecidos, visando definição e contínua melhoria das soluções de higienização que forem implementadas. Para tanto, seu efetivo técnico local realizará visitas mensais preventivas e corretivas, conforme as necessidades, sem ônus adicional à CONTRATANTE, visando bem assistir à CONTRATANTE. Os atendimentos emergenciais deverão ser realizados em até 72 (setenta e duas) horas, contadas da solicitação da CONTRATANTE.", "10.2. A CONTRATADA, suplementar e gratuitamente, oferecerá, a seu critério, quando as demandas justifiquem, serviços de microbiologia através de equipe especializada, em laboratório locado na sua unidade fabril.", "10.3. A CONTRATADA promoverá, periódica e gratuitamente, treinamento do pessoal operacional da CONTRATANTE."]}, {"t": "CLÁUSULA 11 — DAS CONDIÇÕES DE UTILIZAÇÃO DE PRODUTOS E EQUIPAMENTOS", "p": ["11.1. A CONTRATANTE, a partir da data de instalação dos equipamentos comodatados e primeiro fornecimento dos PRODUTOS, obriga-se a:", "11.1.1. Utilizar os equipamentos e produtos, conforme as correspondentes prescrições técnicas fornecidas pela Indeba Express.", "11.1.2. Não ceder, vender, ou alugar a terceiros os equipamentos cedidos em comodato.", "11.1.3. Ao término do prazo deste contrato, sem que as partes acordem a sua renovação, ou na hipótese de rescisão, a devolver os equipamentos comodatados, em perfeitas condições de uso, ou a adquiri-los, segundo condições a serem acordadas entre as partes.", "11.1.4. Manter os equipamentos nos locais da instalação, somente promovendo remoção com prévia anuência, por escrito, da CONTRATADA.", "11.1.5. Não promover modificações de qualquer natureza nos equipamentos.", "11.1.6. Permitir o acesso de pessoal autorizado pela CONTRATADA para realização da manutenção ou reparo dos equipamentos e, ainda, a sua remoção, caso cabível.", "11.1.7. Responsabilizar-se financeiramente, ao preço de venda da tabela da CONTRATADA, vigente na data da eventual ocorrência, por qualquer dano, perda ou inutilização dos equipamentos, decorrente de mau uso ou de interferência de pessoal não habilitado e/ou não autorizado pela CONTRATADA.", "11.1.8. Utilizar nos equipamentos exclusivamente os PRODUTOS fornecidos pela CONTRATADA."]}, {"t": "CLÁUSULA 12 — DA DURAÇÃO DO CONTRATO", "p": ["O prazo de duração deste contrato é de {prazo}, a contar da data da sua assinatura, sendo prorrogado pelo mesmo período através de aditivo, desde que não haja manifestação contrária das partes."]}, {"t": "CLÁUSULA 13 — CESSÃO", "p": ["O presente Contrato produzirá seus efeitos entre as partes contratantes, a partir da data de sua assinatura, sendo vetada sua cessão ou transferência, total ou parcial, por qualquer dos contratantes, sem o prévio e expresso consentimento do outro contratante."]}, {"t": "CLÁUSULA 14 — DA RESCISÃO DO CONTRATO", "p": ["14.1. O presente contrato poderá ser rescindido por qualquer das partes, a qualquer tempo, mediante comunicação por escrito, com 30 (trinta) dias de antecedência.", "14.2. Na hipótese de a CONTRATANTE rescindir o presente contrato antes do vencimento do prazo inicial de {prazo}, não implicará ressarcimento à CONTRATADA pelos investimentos realizados para a aquisição e cessão dos equipamentos estipulados na Cláusula 8, itens 8.1 e 8.2. Apenas nos casos de dano ou perda dos equipamentos comodatados, a CONTRATANTE assumirá o ressarcimento do valor de mercado de cada equipamento, durante e após o encerramento do contrato.", "14.3. No caso de falência ou recuperação judicial de qualquer das partes, a outra parte poderá considerar rescindido o presente contrato, de pleno direito, independentemente de notificação ou interpelação judicial ou extrajudicial."]}, {"t": "CLÁUSULA 15 — DISPOSIÇÕES GERAIS", "p": ["15.1. Os prepostos da CONTRATADA não estão obrigados ao cumprimento de horário e não se subordinam técnica e/ou hierarquicamente à CONTRATANTE, mas deverão seguir as normas de acesso e segurança da CONTRATANTE.", "15.2. A CONTRATADA assume integral responsabilidade pelo seu pessoal, mesmo quando a serviço da CONTRATANTE, arcando, por sua conta, com os encargos necessários ao desempenho de suas atividades, inclusive, mas não apenas, o pagamento de contribuições, taxas, emolumentos e impostos decorrentes da remuneração de seu pessoal, salários, encargos sociais, previdenciários e trabalhistas, inclusive indenizações de qualquer espécie e o custeio de despesas de sua organização, de modo que         var a = stops[seg], b = stops[seg + 1];
        var c = L.rgb((a[0] + (b[0] - a[0]) * tt) / 255, (a[1] + (b[1] - a[1]) * tt) / 255, (a[2] + (b[2] - a[2]) * tt) / 255);
        page.drawRectangle({ x: x + (w / N) * i, y: yy, width: w / N + 0.7, height: h, color: c });
      }
    }

    function newPage() {
      page = doc.addPage([W, H]);
      pages.push(page);
      if (pages.length === 1) {
        page.drawRectangle({ x: 0, y: H - BAND_H, width: W, height: BAND_H, color: NAVY });
        gradientStrip(0, H - BAND_H - 5, W, 5);
        var lh = 70, lw = lh * imgWhite.width / imgWhite.height;
        page.drawImage(imgWhite, { x: LM, y: H - BAND_H / 2 - lh / 2, width: lw, height: lh });
        var fw = 190, fh = fw * imgFlame.height / imgFlame.width;
        page.drawImage(imgFlame, { x: W - RM - fw + 14, y: H - BAND_H + 22, width: fw, height: fh });
        y = H - BAND_H - 5 - 28;
      } else {
        y = H - 82;
      }
    }
    function need(hh) { if (y - hh < BOT) newPage(); }

    /* Texto compatível com WinAnsi (fontes padrão do PDF) */
    var okCache = {};
    function safe(s) {
      s = String(s == null ? '' : s).normalize('NFC').replace(/[\r\n\t]+/g, ' ');
      var out = '';
      for (var ch of s) {
        if (okCache[ch] === undefined) {
          try { F.r.encodeText(ch); okCache[ch] = ch; }
          catch (e) { okCache[ch] = /\S/.test(ch) ? '?' : ' '; }
        }
        out += okCache[ch];
      }
      return out;
    }
    /* Largura sem kerning (drawText não aplica kerning; medir por caractere evita palavras coladas) */
    var cwCache = new Map();
    function tw(font, text, size) {
      var m = cwCache.get(font);
      if (!m) { m = {}; cwCache.set(font, m); }
      var sum = 0;
      for (var ch of text) {
        var w = m[ch];
        if (w === undefined) { w = font.widthOfTextAtSize(ch, 1000); m[ch] = w; }
        sum += w;
      }
      return sum * size / 1000;
    }

    function line(x1, y1, x2, y2, th, col) { page.drawLine({ start: { x: x1, y: y1 }, end: { x: x2, y: y2 }, thickness: th, color: col }); }
    function textAt(text, x, base, font, size, col) { if (text) page.drawText(text, { x: x, y: base, size: size, font: font, color: col || INK }); }

    function wrapPlain(text, font, size, maxW) {
      var words = safe(text).split(/\s+/).filter(Boolean), lines = [], cur = '';
      words.forEach(function (w) {
        var t = cur ? cur + ' ' + w : w;
        if (cur && tw(font, t, size) > maxW) { lines.push(cur); cur = w; } else cur = t;
      });
      if (cur) lines.push(cur);
      return lines;
    }

    function toWords(runs, size) {
      var words = [], cur = null;
      runs.forEach(function (r) {
        var bold = r.k === 'fill';
        var text = r.k === 'empty' ? BLANK[r.tok] : r.t;
        safe(text).split(/(\s+)/).forEach(function (p) {
          if (!p) return;
          if (/^\s+$/.test(p)) { cur = null; return; }
          if (!cur) { cur = { pieces: [], width: 0 }; words.push(cur); }
          var font = bold ? F.b : F.r, wd = tw(font, p, size);
          cur.pieces.push({ t: p, font: font, col: bold ? NAVY : INK, wd: wd });
          cur.width += wd;
        });
      });
      return words;
    }

    /* Parágrafo justificado com recuo pendente (número da cláusula em destaque na margem) */
    function layoutPara(runs, o) {
      o = o || {};
      var size = o.size || BODY, lead = o.lead || LEAD, x0 = o.x == null ? LM : o.x, maxW = (o.w == null ? W - RM - x0 : o.w);
      var just = o.align !== 'l', after = o.after == null ? 5.5 : o.after;
      var spaceW = tw(F.r, ' ', size);
      var words = toWords(runs, size), lines = [], cur = [], sum = 0;
      words.forEach(function (w) {
        if (cur.length && sum + spaceW + w.width > maxW) { lines.push({ w: cur, sum: sum }); cur = [w]; sum = w.width; }
        else { sum += (cur.length ? spaceW : 0) + w.width; cur.push(w); }
      });
      if (cur.length) lines.push({ w: cur, sum: sum });
      return { lines: lines, size: size, lead: lead, x0: x0, maxW: maxW, just: just, after: after, spaceW: spaceW, num: o.num };
    }
    function paraH(runs, o) { var P = layoutPara(runs, o); return P.lines.length * P.lead + P.after; }
    function paragraph(runs, o) {
      var P = layoutPara(runs, o), lines = P.lines, size = P.size, lead = P.lead, spaceW = P.spaceW, maxW = P.maxW;
      var fit = Math.floor((y - BOT) / lead), breakAt = -1;
      if (lines.length > fit) {
        if (fit < 2) newPage();                              // evita deixar 1 linha solta no fim da página
        else if (lines.length - fit === 1) breakAt = fit - 1; // evita 1 linha solta no topo da próxima
      }
      lines.forEach(function (ln, i) {
        if (i === breakAt) newPage();
        need(lead);
        var base = y - size, x = P.x0, gap = spaceW;
        if (i === 0 && P.num) textAt(P.num.t, P.num.x, base, F.b, size, ORANGE);
        if (P.just && i < lines.length - 1 && ln.w.length > 1) {
          var g = (maxW - (ln.sum - spaceW * (ln.w.length - 1))) / (ln.w.length - 1);
          if (g <= spaceW * 3) gap = g;
        }
        ln.w.forEach(function (w) {
          w.pieces.forEach(function (p) { textAt(p.t, x, base, p.font, size, p.col); x += p.wd; });
          x += gap;
        });
        y -= lead;
      });
      y -= P.after;
    }

    /* Título da cláusula: selo azul com "CLÁUSULA N" + título em azul, com filete e detalhe laranja */
    function clauseHeading(text) {
      var pc = parseClause(text), bs = 8, bh = 18;
      var bw = tw(F.b, pc.num, bs) + 18, tsz = 10.5;
      var tl = wrapPlain(pc.title, F.b, tsz, CW - bw - 12);
      var hh = Math.max(bh, tl.length * 13);
      need(hh + 24 + 3 * LEAD);
      y -= 17;
      page.drawRectangle({ x: LM, y: y - bh, width: bw, height: bh, color: NAVY });
      textAt(pc.num, LM + 9, y - bh + 6, F.b, bs, WHITE);
      tl.forEach(function (t, k) { textAt(t, LM + bw + 12, y - 12.5 - k * 13, F.b, tsz, NAVY); });
      y -= hh + 6;
      line(LM, y, W - RM, y, 0.5, HAIR);
      page.drawRectangle({ x: LM, y: y - 0.9, width: 46, height: 1.8, color: ORANGE });
      y -= 11;
    }

    function blankLines(n, x) {
      for (var i = 0; i < n; i++) {
        need(20);
        line(x, y - 18, W - RM, y - 18, 0.5, LINEC);
        y -= 20;
      }
    }

    /* ---------- Título e quadro das partes ---------- */
    newPage();
    (function () {
      var tl = wrapPlain(TITLE, F.b, 14, CW - 14), th = tl.length * 18;
      page.drawRectangle({ x: LM, y: y - th + 3, width: 3.5, height: th - 1, color: ORANGE });
      tl.forEach(function (t, i) { textAt(t, LM + 14, y - 13 - i * 18, F.b, 14, NAVY); });
      y -= th + 20;

      var gapC = 14, cw = (CW - gapC) / 2, inner = cw - 3 - 12 - 12;
      function card(label, name, cnpj, accent, fixed) {
        var nl = name ? wrapPlain(name, F.b, 10.5, inner) : [];
        var cl = cnpj ? wrapPlain(cnpj, F.b, 10.5, inner) : [];
        return { label: label, nl: nl, cl: cl, accent: accent, fixed: fixed,
                 h: 16 + 16 + Math.max(1, nl.length) * 13 + 8 + 16 + Math.max(1, cl.length) * 13 + 12 };
      }
      var A = card('CONTRATANTE', v.nome, v.cnpj, NAVY, false);
      var B = card('CONTRATADA', 'INDEBA EXPRESS', INDEBA_CNPJ, ORANGE, true);
      var hh = Math.max(A.h, B.h);
      need(hh + 20);
      [A, B].forEach(function (c, idx) {
        var x = LM + idx * (cw + gapC);
        page.drawRectangle({ x: x, y: y - hh, width: cw, height: hh, color: CARD });
        page.drawRectangle({ x: x, y: y - hh, width: 3, height: hh, color: c.accent });
        var px = x + 3 + 12, by = y - 16;
        textAt(c.label, px, by, F.b, 7.5, ORANGE);
        textAt('Razão social', px, by - 15, F.r, 7.5, SOFT);
        var vy = by - 15 - 13;
        if (c.nl.length) c.nl.forEach(function (t, k) { textAt(t, px, vy - k * 13, F.b, 10.5, NAVY); });
        else line(px, vy - 3, x + cw - 12, vy - 3, 0.5, LINEC);
        var cy = vy - (Math.max(1, c.nl.length) - 1) * 13 - 22;
        textAt('CNPJ', px, cy, F.r, 7.5, SOFT);
        var vy2 = cy - 13;
        if (c.cl.length) c.cl.forEach(function (t, k) { textAt(t, px, vy2 - k * 13, F.b, 10.5, NAVY); });
        else line(px, vy2 - 3, x + cw - 12, vy2 - 3, 0.5, LINEC);
      });
      y -= hh + 18;
    })();

    paragraph([{ k: 'text', t: INTRO }], { after: 2 });

    /* ---------- Fecho e assinaturas: definições (usadas também para medir a altura) ---------- */
    var SIGN = { colW: (CW - 44) / 2, size: 9.8, lead: 13.5 };
    var CLOSING_RUNS = [{ k: 'text', t: CLOSING }];
    var DATE_RUNS = [{ k: 'text', t: 'Salvador, ' }, resolveToken('data', v), { k: 'text', t: '.' }];
    var SIGN_A = [{ t: 'INDEBA EXPRESS', b: 1 }, { t: 'CONTRATADA' }, { t: 'Nome:' }, { t: 'CPF:' }];
    var SIGN_B = [{ t: 'CONTRATANTE', b: 1 }, { t: 'Razão social: ' + (v.nome || '') }, { t: 'Nome:' }, { t: 'CPF:' }];
    var SIGN_W = [{ t: 'Nome:' }, { t: 'CPF:' }];
    function prepSign(list) {
      var out = [];
      list.forEach(function (it) {
        var font = it.b ? F.b : F.r;
        wrapPlain(it.t, font, SIGN.size, SIGN.colW).forEach(function (s) { out.push({ t: s, f: font, c: it.b ? NAVY : INK }); });
      });
      return out;
    }
    function signRows(l, r) { return Math.max(prepSign(l).length, prepSign(r).length); }
    function signColumns(leftLines, rightLines) {
      var A = prepSign(leftLines), B = prepSign(rightLines), n = Math.max(A.length, B.length), lead = SIGN.lead;
      need(n * lead + 20);
      var top = y, x2 = LM + SIGN.colW + 44;
      line(LM, top, LM + SIGN.colW, top, 1.2, NAVY);
      line(x2, top, W - RM, top, 1.2, NAVY);
      A.forEach(function (o, i) { textAt(o.t, LM, top - 14 - i * lead, o.f, SIGN.size, o.c); });
      B.forEach(function (o, i) { textAt(o.t, x2, top - 14 - i * lead, o.f, SIGN.size, o.c); });
      y = top - 14 - n * lead;
    }
    function signBlockH() {
      return 12 + paraH(CLOSING_RUNS, { after: 6 }) + paraH(DATE_RUNS, { align: 'l', after: 0 }) + 38
        + (signRows(SIGN_A, SIGN_B) * SIGN.lead + 14) + 24 + 42 + (signRows(SIGN_W, SIGN_W) * SIGN.lead + 14) + 10;
    }
    /* Altura de uma cláusula sem tabelas/equipamentos (usada para manter Foro + assinaturas juntos) */
    function clauseH(c) {
      var pc = parseClause(c.t), bw = tw(F.b, pc.num, 8) + 18;
      var tl = wrapPlain(pc.title, F.b, 10.5, CW - bw - 12);
      var total = 17 + Math.max(18, tl.length * 13) + 6 + 11;
      itemsFor(c, v).forEach(function (item) {
        if (typeof item !== 'string') return;
        var it = parseItem(item);
        total += paraH(toRuns(it.text, v), { x: LM + (it.lvl === 2 ? TXT2 : TXT1), num: it.num ? { t: it.num, x: 0 } : null });
      });
      return total;
    }

    /* ---------- Cláusulas ---------- */
    CLAUSES.forEach(function (c, ci) {
      if (ci === CLAUSES.length - 1) need(clauseH(c) + signBlockH());   // Foro + fecho + assinaturas na mesma página, se couberem
      clauseHeading(c.t);
      itemsFor(c, v).forEach(function (item) {
        if (typeof item === 'object' && item.equip) {
          var ex = LM + TXT1;
          need(60);
          paragraph([{ k: 'fill', t: 'Equipamentos comodatados:' }], { x: ex, align: 'l', after: 2 });
          if (v.equip) {
            v.equip.split(/\r?\n/).forEach(function (ln) {
              if (ln.trim()) paragraph([{ k: 'fill', t: ln.trim() }], { x: ex, align: 'l', after: 2 });
            });
            y -= 5;
          } else {
            blankLines(3, ex);
            y -= 5;
          }
          return;
        }
        var it = parseItem(item);
        var tx = LM + (it.lvl === 2 ? TXT2 : TXT1);
        var num = it.num ? { t: it.num, x: LM + (it.lvl === 2 ? TXT1 : 0) } : null;
        paragraph(toRuns(it.text, v), { x: tx, num: num });
      });
    });

    /* ---------- Fecho e assinaturas ---------- */
    need(signBlockH());
    y -= 12;
    paragraph(CLOSING_RUNS, { after: 6 });
    paragraph(DATE_RUNS, { align: 'l', after: 0 });
    y -= 38;
    signColumns(SIGN_A, SIGN_B);
    y -= 24;
    page.drawRectangle({ x: LM, y: y - 8, width: 3, height: 10, color: ORANGE });
    textAt('TESTEMUNHAS', LM + 9, y - 6, F.b, 8.5, NAVY);
    y -= 12 + 30;
    signColumns(SIGN_W, SIGN_W);

    /* ---------- Cabeçalho e rodapé em todas as páginas ---------- */
    var total = pages.length;
    pages.forEach(function (pg, i) {
      page = pg;
      if (i > 0) {
        gradientStrip(0, H - 5, W, 5);
        var lh = 26, lw = lh * imgNavy.width / imgNavy.height;
        page.drawImage(imgNavy, { x: LM, y: H - 30 - lh, width: lw, height: lh });
        var t = 'Contrato de Fornecimento e Assistência Técnica';
        textAt(t, W - RM - tw(F.r, t, 8), H - 50, F.r, 8, SOFT);
        line(LM, H - 64, W - RM, H - 64, 0.5, HAIR);
      }
      line(LM, 48, W - RM, 48, 0.5, HAIR);
      textAt('Indeba Express', LM, 33, F.r, 7.5, SOFT);
      var pn = 'Página ' + (i + 1) + ' de ' + total;
      textAt(pn, W - RM - tw(F.b, pn, 7.5), 33, F.b, 7.5, NAVY);
      page.drawRectangle({ x: 0, y: 0, width: W, height: 4, color: NAVY });
    });

    return await doc.save();
  }

  /* ================= Ações ================= */
  var statusEl = $('actionStatus'), statusTimer = null;
  function say(msg, keep, ms) {
    statusEl.textContent = msg;
    clearTimeout(statusTimer);
    if (!keep) statusTimer = setTimeout(function () { statusEl.textContent = ''; }, ms || 3000);
  }
  function slugName(s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 60);
  }

  async function deliverPdf(bytes, filename) {
    var blob = new Blob([bytes], { type: 'application/pdf' });
    var dl = null;
    try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename: filename, data: blob }); return 'saved'; }
      catch (e) { if (e && e.code === 'declined') return 'declined'; /* outros erros: tenta o download comum */ }
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return 'saved';
  }

  $('btnPdf').addEventListener('click', async function () {
    var btn = $('btnPdf');
    if (btn.disabled) return;
    if (!window.PDFLib) { say('Biblioteca de PDF não carregou. Recarregue a página.'); return; }
    btn.disabled = true;
    say('Gerando PDF…', true);
    try {
      var v = currentValues();
      var bytes = await buildPdf(v);
      var filename = 'contrato-comodato-' + (slugName(v.nome) || 'indeba') + '.pdf';
      var res = await deliverPdf(bytes, filename);
      if (res === 'declined') say('Download cancelado');
      else if (cnpjStatus(v.cnpj) === 'invalid') say('PDF pronto — confira o CNPJ do cliente', false, 7000);
      else say('PDF pronto ✓');
    } catch (e) {
      console.error(e);
      say('Não foi possível gerar o PDF');
    } finally {
      btn.disabled = false;
    }
  });

  $('btnCopy').addEventListener('click', function () {
    var text = $('docPage').innerText.replace(/\n{3,}/g, '\n\n');
    function ok() { say('Copiado ✓'); }
    function fail() { say('Não foi possível copiar'); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok, fail);
      } else {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        ok();
      }
    } catch (e) { fail(); }
  });

  fields.cnpj.addEventListener('input', function () {
    var f = formatCnpj(fields.cnpj.value);
    if (f !== fields.cnpj.value) fields.cnpj.value = f;
  });
  Object.keys(fields).forEach(function (k) {
    if (k === 'c142') return;
    fields[k].addEventListener('input', function () { renderPreview(); persist(); });
  });
  fields.c142.addEventListener('input', function () {
    var val = fields.c142.value.trim();
    dirty142 = !!val && val !== default142Body(currentValues()).trim();
    renderPreview(); persist();
  });
  fields.c142.addEventListener('blur', function () {
    if (!fields.c142.value.trim()) { dirty142 = false; renderPreview(); persist(); }
  });
  $('btnReset142').addEventListener('click', function () {
    dirty142 = false;
    fields.c142.value = '';
    renderPreview(); persist();
    say('Texto padrão restaurado ✓');
  });

  loadSaved();
  fields.cnpj.value = formatCnpj(fields.cnpj.value);
  renderPreview();
})();
</script>
</body>
</html>
