<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de Certificados — Indeba Express</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./pdf-lib.min.js"></script>
<script src="./jszip.min.js"></script>
<style>
:root{--navy:#1a3253;--orange:#eb5a1a;--ink:#1c2433;--soft:#55607a;--paper:#f3f5f9;--panel:#fff;--line:#dde2ec;--brand:#1a3253;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8ecf4;--soft:#a6b0c6;--paper:#0e1626;--panel:#152036;--line:#263450;--brand:#8fb0e6;--on:#0e1a2e}}
:root[data-theme="dark"]{--ink:#e8ecf4;--soft:#a6b0c6;--paper:#0e1626;--panel:#152036;--line:#263450;--brand:#8fb0e6;--on:#0e1a2e}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink)}
header{background:var(--navy);padding:14px 24px;position:relative}
header img{height:40px;display:block;max-width:100%}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#e73620,#eb5a1a 55%,#fad306)}
main{max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(290px,380px) 1fr;gap:22px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr;padding:14px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
h2.t{font-size:16px;margin:0 0 14px;color:var(--brand)}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;margin-bottom:14px}
input,textarea{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%}
textarea{min-height:150px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.hint{font-size:12px;color:var(--soft);font-weight:400;line-height:1.4}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
button{font:inherit;font-size:13.5px;font-weight:600;padding:10px 14px;border-radius:6px;border:1px solid var(--brand);background:var(--brand);color:var(--on);cursor:pointer}
button.sec{background:transparent;color:var(--brand)}button:disabled{opacity:.55;cursor:progress}
#msg{font-size:12.5px;color:var(--brand);margin-top:10px;min-height:18px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--soft)}
.cert{container-type:inline-size;position:relative;aspect-ratio:842/595;background:#fff;color:#1a3253;box-shadow:0 2px 18px rgba(16,30,60,.16);overflow:hidden;border-radius:3px}
.cert .band{height:20.2%;background:#1a3253;display:flex;align-items:center;padding-left:5.5%}
.cert .band img{height:52%}
.cert .strip{height:.85%;background:linear-gradient(90deg,#e73620,#eb5a1a 55%,#fad306)}
.cert .bd{position:absolute;left:0;right:0;top:27%;text-align:center}
.cert h3{margin:0;font-size:3.5cqw;letter-spacing:.01em}
.cert i.bar{display:block;width:7%;height:.5cqw;background:#eb5a1a;margin:1.8cqw auto 3cqw}
.cert .c{margin:0;font-size:1.8cqw;color:#55607a}
.cert .nm{width:74%;margin:1.2cqw auto 0;min-height:5cqw;border-bottom:1px solid #1a3253;font-weight:700;font-size:3.3cqw;line-height:5cqw}
.cert .tx{margin:2.8cqw 0 0;padding:0 14%;font-size:1.75cqw;line-height:1.7;color:#1e2533;overflow-wrap:anywhere}
.cert .sg{position:absolute;left:38%;width:24%;bottom:9%;border-top:1px solid #1a3253;padding-top:.6cqw;text-align:center;font-size:1.3cqw}
</style>
</head>

async function save(name,data){var dl=null;
